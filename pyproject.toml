[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "starsim.idmod.org"
version = "0.1.0"
description = "Documentation home for Starsim at IDM"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Starsim Development Team", email = "info@starsim.org" },
  { name = "Cliff Kerr" },
  { name = "Robyn Stuart" },
  { name = "Romesh Abeysuriya" },
  { name = "Paula Sanz-Leon" },
  { name = "Jamie Cohen" },
  { name = "Daniel Klein" }
]
keywords = ["modeling", "IDM"]
license = "MIT"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "mkdocs-material",
    "mkdocs-include-markdown-plugin",
    "mkdocstrings-python",
    "mkdocs-autoapi",
    "mkdocs-glightbox",
    "mkdocs-table-reader-plugin",
]

[project.urls]
Repository = "https://github.com/starsimhub/starsim.idmod.org"
Documentation = "https://starsim.idmod.org/"
Issues = "https://github.com/starsimhub/starsim.idmod.org/issues"
