<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    (function () {
      var target = "https://starsim.org" + location.pathname + location.search + location.hash;
      location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://starsim.org/">
  <link rel="canonical" href="https://starsim.org/">
  <style>
    body { font-family: Roboto, system-ui, sans-serif; margin: 4em auto; max-width: 40em; padding: 0 1em; color: #333; }
    a { color: #0288d1; }
  </style>
</head>
<body>
  <h1>Redirecting…</h1>
  <p>This page has moved. If you are not redirected automatically, follow this
    <a id="link" href="https://starsim.org/">link to starsim.org</a>.</p>
  <script>
    document.getElementById("link").href =
      "https://starsim.org" + location.pathname + location.search + location.hash;
  </script>
</body>
</html>
